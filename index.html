<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#10203f;--mu:#5b6782;--pr:#12306b;--ok:#1a9a52;--er:#d62f3a;--bd:#dde3ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1426;--card:#16213a;--tx:#eef2fb;--mu:#9aa7c4;--pr:#6c97ff;--bd:#27345a}}
:root[data-theme="dark"]{--bg:#0c1426;--card:#16213a;--tx:#eef2fb;--mu:#9aa7c4;--pr:#6c97ff;--bd:#27345a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
header{background:#12306b;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0}header small{opacity:.8;display:block;font-size:12px}
.tools button{background:#ffffff22;border:0;color:#fff;border-radius:8px;padding:6px 10px;margin-inline-start:6px;font-size:13px}
main{max-width:560px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile,.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.tile{border:1px solid var(--bd);color:var(--tx);font-size:15px;text-align:center;font-weight:600}
.tile span{display:block;font-size:26px;margin-bottom:4px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px;width:100%;font-size:15px;font-weight:600;margin-top:10px}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.opt{display:block;width:100%;text-align:start;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px;font-size:15px}
.opt.ok{border-color:var(--ok);background:#1a9a5222}.opt.no{border-color:var(--er);background:#d62f3a22}
.bar{height:6px;background:var(--bd);border-radius:4px;margin:8px 0}.bar i{display:block;height:100%;background:var(--pr);border-radius:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:13px}
.exp{margin-top:10px;padding:10px;border-radius:10px;background:var(--bd);font-size:14px}
.sign{display:flex;justify-content:center;margin:8px 0}h2{font-size:18px;margin:6px 0 10px}
.star{background:none;border:0;font-size:22px;color:#e8a800}
.chip{display:inline-block;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:8px 12px;margin:4px;font-size:14px}input.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}.hero{background:linear-gradient(135deg,#12306b,#1456b8);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}.stats{display:flex;gap:8px;margin-top:12px}.stats div{flex:1;background:#ffffff22;border-radius:10px;padding:8px;text-align:center;font-size:12px}.stats b{display:block;font-size:18px}.plan{border-width:2px}.plan.hi{border-color:var(--pr)}.plan ul{padding-inline-start:18px;margin:8px 0;font-size:14px}.sec{font-size:13px;color:var(--mu);margin:14px 4px 6px}.badge{padding:3px 8px;border-radius:8px;font-size:12px;color:#fff}.bgok{background:var(--ok)}.bgno{background:var(--er)}
</style>
</head>
